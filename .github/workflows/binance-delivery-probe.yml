name: Binance delivery diagnosis
on:
  push:
    branches: [fix/binance-delivery-diagnosis-20260926]
permissions:
  contents: read
jobs:
  probe:
    runs-on: [self-hosted, home-deluxe-bot]
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: |
          python3 -m venv .venv-probe
          .venv-probe/bin/python -m pip install -r requirements.txt
          .venv-probe/bin/python ops/probe-binance-delivery.py
